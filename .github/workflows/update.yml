name: Update rulesets

on:
  schedule:
    # 19:00 UTC = 03:00 Asia/Shanghai (UTC+8). GitHub cron is always UTC.
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-rulesets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build rulesets
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash Surge README.md
          if git diff --cached --quiet; then
            echo "Rulesets unchanged."
          else
            git commit -m "chore: update rulesets $(date -u +'%Y-%m-%d')"
            git push
          fi

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling through the API keeps the daily schedule alive even when
      # rules haven't changed (no commit needed).
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
